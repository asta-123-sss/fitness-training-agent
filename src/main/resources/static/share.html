<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>训练方案 · 只读分享</title>
  <script src="/js/tailwind.js?v=1"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#211c30',
            accent: '#0066ff',
            accentd: '#0052cc'
          }
        }
      }
    }
  </script>
  <style>
    .markdown-body { color: #2b2735; line-height: 1.75; font-size: 0.95rem; word-break: break-word; }
    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: #211c30; font-weight: 600; line-height: 1.4; margin: 1.5em 0 0.6em; }
    .markdown-body h1 { font-size: 1.5rem; padding-bottom: 0.4em; border-bottom: 1px solid #e5e7eb; }
    .markdown-body h2 { font-size: 1.25rem; }
    .markdown-body h3 { font-size: 1.1rem; }
    .markdown-body h4 { font-size: 1rem; }
    .markdown-body p { margin: 0.7em 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 0.7em 0; }
    .markdown-body li { margin: 0.3em 0; }
    .markdown-body li::marker { color: #0066ff; }
    .markdown-body strong { color: #0052cc; font-weight: 600; }
    .markdown-body a { color: #0066ff; text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body blockquote { border-left: 3px solid #0066ff; background: #f0f6ff; padding: 0.5em 1em; margin: 1em 0; color: #4b5563; border-radius: 0 6px 6px 0; }
    .markdown-body code { background: #f3f4f6; color: #d6336c; padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.86em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .markdown-body pre { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 1em 0; line-height: 1.6; }
    .markdown-body pre code { background: transparent; padding: 0; color: #1f2937; font-size: 0.86em; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.9rem; }
    .markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 8px 12px; text-align: left; }
    .markdown-body th { background: #f9fafb; color: #211c30; font-weight: 600; }
    .markdown-body hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.5em 0; }
    .markdown-body img { max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body class="bg-white text-ink antialiased">
<div class="max-w-3xl mx-auto px-4 py-10 sm:py-14">

  <header class="mb-8 text-center">
    <h1 class="text-2xl sm:text-3xl font-semibold text-ink">🏋️ 训练方案</h1>
    <p class="mt-2 text-sm text-gray-500">以下方案仅供只读查看</p>
  </header>

  <section id="statusCard" class="hidden items-center gap-3 rounded-2xl border border-gray-200 bg-white px-5 py-4 mb-6 text-sm shadow-sm">
    <div class="h-4 w-4 shrink-0 rounded-full border-2 border-gray-200 border-t-accent animate-spin"></div>
    <span id="statusText" class="text-ink">加载中…</span>
  </section>

  <section id="errorCard" class="hidden rounded-2xl border border-red-200 bg-red-50 px-5 py-4 mb-6 text-sm text-red-600"></section>

  <section id="resultCard" class="hidden rounded-2xl border border-gray-200 bg-white p-5 sm:p-6 shadow-sm">
    <div id="planContent" class="markdown-body"></div>
    <div id="shareBox" class="hidden flex-col sm:flex-row items-start sm:items-center gap-5 mt-6 pt-5 border-t border-gray-200">
      <div class="flex-1 w-full">
        <h3 class="text-sm font-medium text-ink mb-2">分享这份方案</h3>
        <input id="shareLink" readonly class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-xs text-gray-500 mb-3">
        <button id="copyBtn" class="rounded-lg border border-gray-200 px-4 py-2 text-xs text-gray-700 hover:bg-gray-50">复制链接</button>
      </div>
      <div class="flex-shrink-0">
        <div id="qrcode" class="inline-block rounded-lg border border-gray-200 bg-white p-2"></div>
      </div>
    </div>
  </section>

</div>

<script src="/js/qrcode.min.js"></script>
<script src="/js/marked.min.js"></script>
<script src="/js/share.js"></script>
</body>
</html>
